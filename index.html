<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E6E7E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="태그 조판소">
<title>태그 조판소</title>
<style>
:root{
  --paper:#E6E7E1; --paper-2:#DDDED7;
  --ink:#16181C; --ink-60:rgba(22,24,28,.60); --ink-30:rgba(22,24,28,.28); --ink-12:rgba(22,24,28,.12);
  --spot:#FF3D8A; --spot-tint:#FFDCEA;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --bar:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--kr); font-size:15px; line-height:1.45;
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 12px)}

header{position:sticky; top:0; z-index:30; background:var(--paper);
  border-bottom:1px solid var(--ink); padding:10px 14px 0; padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
.brand h1{font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; margin:0}
.brand .sub{font-size:11px; color:var(--ink-60); font-family:var(--mono)}
.brand .count{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--spot); font-weight:700}

.search{position:relative; margin-bottom:9px}
.search input{width:100%; font-family:var(--kr); font-size:16px; color:var(--ink); background:transparent;
  border:0; border-bottom:2px solid var(--ink); padding:7px 26px 7px 0; border-radius:0; outline:none}
.search input::placeholder{color:var(--ink-30)}
.search input:focus{border-bottom-color:var(--spot)}
.search .clr{position:absolute; right:0; top:50%; transform:translateY(-50%); border:0; background:none;
  color:var(--ink-30); font-size:19px; cursor:pointer; padding:0 4px; display:none; line-height:1}
.search.has .clr{display:block}

nav{display:flex; overflow-x:auto; scrollbar-width:none; margin:0 -14px; padding:0 14px; min-height:35px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto; font-family:var(--kr); font-size:13px; font-weight:600; background:none;
  border:0; border-bottom:3px solid transparent; color:var(--ink-60); padding:8px 11px; cursor:pointer; white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--spot)}

main{padding:14px 14px 20px}
.cat{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-60);
  margin:18px 0 7px; padding-bottom:3px; border-bottom:1px solid var(--ink-12)}
.cat:first-child{margin-top:0}
.grid{display:flex; flex-wrap:wrap; gap:6px}

.chip{font-family:var(--kr); font-size:13.5px; line-height:1; background:var(--paper); color:var(--ink);
  border:1.5px solid var(--ink-30); border-radius:2px; padding:9px 11px; cursor:pointer;
  transition:transform .08s, box-shadow .08s}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--spot); outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--spot-tint); border-color:var(--ink); font-weight:600;
  box-shadow:3px 3px 0 var(--spot); transform:translate(-1px,-1px)}
.chip .en{display:block; font-family:var(--mono); font-size:10px; color:var(--ink-60); margin-top:4px}
.chip[aria-pressed="true"] .en{color:var(--ink)}

.msg{padding:34px 4px; text-align:center; color:var(--ink-60); font-size:13.5px; line-height:1.7}
.msg b{color:var(--ink)}
.msg code{font-family:var(--mono); font-size:12px; background:var(--paper-2); padding:2px 5px; border-radius:2px}
.msg .big{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--spot); display:block; margin-bottom:10px}
.msg pre{text-align:left; font-family:var(--mono); font-size:10.5px; line-height:1.6; background:var(--paper-2);
  border-left:3px solid var(--spot); padding:11px 12px; margin:14px 0 0; overflow-x:auto; color:var(--ink)}

.bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper-2);
  border-top:2px solid var(--ink); padding:0 14px calc(10px + env(safe-area-inset-bottom));
  max-height:80vh; display:flex; flex-direction:column}
.bar .handle{display:flex; align-items:center; gap:9px; padding:9px 0 8px; cursor:pointer}
.bar .handle .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-60)}
.bar .handle .n{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--spot)}
.bar .handle .caret{margin-left:auto; font-size:11px; color:var(--ink-60); transition:transform .15s}
.bar.open .handle .caret{transform:rotate(180deg)}
.bar .body{display:none; overflow-y:auto; padding-bottom:10px}
.bar.open .body{display:block}

.tabs{display:flex; border-bottom:1px solid var(--ink-12); margin-bottom:12px}
.tabs button{flex:1; font-family:var(--kr); font-size:13px; font-weight:600; background:none; border:0;
  border-bottom:3px solid transparent; color:var(--ink-30); padding:9px 4px; cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--spot)}
.pane{display:none} .pane.on{display:block}

.picked{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px}
.pick{display:inline-flex; align-items:center; border:1.5px solid var(--ink); border-radius:2px;
  background:var(--paper); font-family:var(--mono); font-size:11.5px; overflow:hidden}
.pick.auto{border-style:dashed}
.pick .t{padding:7px 8px; cursor:pointer; border:0; background:none; font:inherit; color:var(--ink)}
.pick .t.up{background:var(--spot-tint); font-weight:700}
.pick .t.dn{color:var(--ink-30)}
.pick .x{border:0; border-left:1.5px solid var(--ink-12); background:none; padding:7px 8px;
  cursor:pointer; color:var(--ink-60); font-size:13px; line-height:1}
.pick .x:hover{background:var(--spot); color:#fff}

.out{font-family:var(--mono); font-size:11.5px; line-height:1.55; background:var(--paper);
  border:1px solid var(--ink-30); padding:9px; border-radius:2px; word-break:break-all;
  min-height:54px; margin-bottom:9px}
.out:empty::before{content:"태그를 고르면 여기에 조판됩니다."; color:var(--ink-30)}

.row{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; align-items:center}
.row button{font-family:var(--mono); font-size:10.5px; background:none; border:1px dashed var(--ink-30);
  border-radius:2px; padding:6px 8px; cursor:pointer; color:var(--ink-60)}
.row button:hover{border-style:solid; border-color:var(--ink); color:var(--ink)}
.row button[aria-pressed="true"]{border-style:solid; border-color:var(--ink); background:var(--ink);
  color:var(--paper); font-weight:700}
.row .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-30); margin-right:2px; flex:0 0 auto}

.acts{display:flex; gap:7px; margin-top:4px}
.acts button{flex:1; font-family:var(--kr); font-size:14px; font-weight:600; padding:12px;
  border-radius:2px; cursor:pointer; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink)}
.acts .go{background:var(--ink); color:var(--paper)}
.acts .go:active{box-shadow:3px 3px 0 var(--spot); transform:translate(-1px,-1px)}

.dice{display:flex; gap:7px; margin-bottom:10px}
.dice button{flex:1; font-family:var(--kr); font-size:14px; font-weight:700; padding:13px 8px;
  border:1.5px solid var(--ink); border-radius:2px; cursor:pointer; background:var(--ink); color:var(--paper)}
.dice button.alt{background:var(--paper); color:var(--ink)}
.dice button:active{box-shadow:3px 3px 0 var(--spot); transform:translate(-1px,-1px)}

.seed{display:flex; align-items:center; gap:6px; margin-bottom:12px}
.seed .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-30)}
.seed input{flex:1; min-width:0; font-family:var(--mono); font-size:12px; color:var(--ink);
  background:var(--paper); border:1px solid var(--ink-30); border-radius:2px; padding:7px 8px; outline:none}
.seed input:focus{border-color:var(--spot)}
.seed button{font-family:var(--mono); font-size:10.5px; background:none; border:1px dashed var(--ink-30);
  border-radius:2px; padding:7px 9px; cursor:pointer; color:var(--ink-60); flex:0 0 auto}
.seed button:hover{border-style:solid; border-color:var(--ink); color:var(--ink)}

.slots{border-top:1px solid var(--ink-12)}
.sl{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--ink-12)}
.sl.off{opacity:.42}
.sl .lk{flex:0 0 auto; width:30px; height:30px; border:1.5px solid var(--ink-30); border-radius:2px;
  background:none; cursor:pointer; font-size:12px; line-height:1; color:var(--ink-30); padding:0}
.sl.lock .lk{border-color:var(--ink); background:var(--spot-tint); color:var(--ink)}
.sl .nm{flex:0 0 62px; font-family:var(--kr); font-size:11px; font-weight:600; color:var(--ink-60)}
.sl .vl{flex:1; min-width:0; font-family:var(--kr); font-size:12.5px; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sl .vl small{font-family:var(--mono); font-size:10px; color:var(--ink-30); margin-left:5px}
.sl.off .vl{color:var(--ink-30)}
.sl .rr{flex:0 0 auto; width:30px; height:30px; border:1.5px solid var(--ink-30); border-radius:2px;
  background:none; cursor:pointer; font-size:13px; line-height:1; color:var(--ink-60); padding:0}
.sl .rr:hover{border-color:var(--ink); background:var(--ink); color:var(--paper)}

.sets{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px}
.set{display:inline-flex; align-items:center; border:1.5px solid var(--ink); border-radius:2px;
  background:var(--paper); overflow:hidden; max-width:100%}
.set.built{border-style:dashed; border-color:var(--ink-30)}
.set .nm{font-family:var(--kr); font-size:12.5px; font-weight:600; padding:7px 9px; border:0;
  background:none; cursor:pointer; color:var(--ink); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:170px}
.set .nm small{font-family:var(--mono); font-weight:400; color:var(--ink-30); margin-left:5px}
.set .nm:hover{background:var(--spot-tint)}
.set .add,.set .x{border:0; border-left:1.5px solid var(--ink-12); background:none; padding:7px 8px;
  cursor:pointer; color:var(--ink-60); font-size:12px; line-height:1; font-family:var(--mono)}
.set .add:hover{background:var(--ink); color:var(--paper)}
.set .x:hover{background:var(--spot); color:#fff}
.sets .none{font-size:12px; color:var(--ink-30); padding:4px 0}

.toast{position:fixed; left:50%; bottom:calc(var(--bar) + 18px); transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:12px; padding:9px 15px;
  border-radius:2px; z-index:60; opacity:0; pointer-events:none; transition:opacity .18s;
  box-shadow:3px 3px 0 var(--spot); max-width:86vw; text-align:center}
.toast.on{opacity:1}

.warn{font-size:11.5px; line-height:1.5; color:var(--ink-60); border-left:2px solid var(--spot);
  padding:2px 0 2px 9px; margin:0 0 10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:720px){
  header,main{max-width:860px; margin-inline:auto}
  .bar{padding-inline:calc((100vw - 860px)/2 + 14px)}
  .sl .nm{flex:0 0 84px; font-size:12px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>태그 조판소</h1><span class="sub" id="srcinfo">tags.json</span><span class="count" id="hcount">0</span>
  </div>
  <div class="search" id="sw">
    <input id="q" type="search" placeholder="한국어 또는 영문 태그로 검색" autocomplete="off" enterkeyhint="search">
    <button class="clr" id="clr" aria-label="검색어 지우기">&times;</button>
  </div>
  <nav id="nav" role="tablist"></nav>
</header>

<main id="main"><p class="msg"><span class="big">tags.json 읽는 중</span></p></main>

<div class="bar" id="bar">
  <div class="handle" id="handle" role="button" tabindex="0" aria-expanded="false">
    <span class="lbl">조판</span><span class="n" id="n">0</span><span class="caret">&#9650;</span>
  </div>
  <div class="body">
    <div class="tabs" role="tablist">
      <button role="tab" data-p="p1" aria-selected="true">조판</button>
      <button role="tab" data-p="p2" aria-selected="false">무작위</button>
      <button role="tab" data-p="p3" aria-selected="false">보관함</button>
    </div>

    <section class="pane on" id="p1">
      <div class="picked" id="picked"></div>
      <div class="out" id="out"></div>
      <div class="row" id="presets"></div>
      <div class="acts">
        <button class="go" id="copy">프롬프트 복사</button>
        <button id="reset">비우기</button>
      </div>
    </section>

    <section class="pane" id="p2">
      <div class="dice">
        <button id="rollall">새로 뽑기</button>
        <button class="alt" id="rollfill">빈 슬롯만</button>
      </div>
      <div class="row" id="themes"><span class="lbl">테마</span></div>
      <div class="row" id="amounts"><span class="lbl">분량</span></div>
      <div class="seed">
        <span class="lbl">시드</span>
        <input id="seedv" autocomplete="off" spellcheck="false" placeholder="—">
        <button id="reroll">이 시드로</button>
      </div>
      <div class="slots" id="slots"></div>
      <p class="warn">자물쇠를 채운 슬롯은 <b>새로 뽑기</b>에도 그대로 남습니다. 슬롯별 ↻ 는 그 자리만 다시 뽑습니다. 슬롯 구성은 이 파일 안 <code>SLOTS</code> 배열에서 직접 고칠 수 있습니다.</p>
    </section>

    <section class="pane" id="p3">
      <div class="sets" id="sets"></div>
      <div class="row">
        <button id="save">＋ 지금 조판 보관</button>
        <button id="exp">presets.json 복사</button>
        <button id="imp">가져오기</button>
      </div>
      <p class="warn" id="warn"></p>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);

/* ══════════════════════════════════════════════════════════════
   설정 — 여기만 고치면 됩니다
   ══════════════════════════════════════════════════════════════ */

const SRC = 'tags.json';   // 같은 폴더에 두세요

const QUALITY = {
  'NAI V4.5'   : 'location, very aesthetic, masterpiece, no text',
  'NAI V3'     : 'best quality, amazing quality, very aesthetic, absurdres',
  'Illustrious': 'masterpiece, best quality, amazing quality, very awa',
  'NoobAI'     : 'masterpiece, best quality, newest, absurdres, highres',
};
const NEG = {
  'NAI 기본': 'nsfw, lowres, artistic error, scan artifacts, worst quality, bad quality, jpeg artifacts, multiple views, very displeasing, bad anatomy, extra digits, fewer digits, watermark, signature',
  '간단'    : 'nsfw, lowres, bad anatomy, bad hands, worst quality, watermark, signature',
};

/* 무작위 슬롯.
   c 는 "대분류 · 소분류" 문자열이며 tags.json 의 category / subCategory 를 그대로 씁니다.
   소분류가 없거나 대분류와 같으면 대분류만 씁니다.
   한 슬롯에서는 반드시 하나만 뽑히므로, 같이 나오면 안 되는 것들을 한 슬롯에 모으세요.
   p    = 뽑힐 확률 (1 이면 항상)
   need = 이 슬롯들이 이미 뽑혔으면 건너뜀
   req  = 지금까지 뽑힌 태그 집합에 대한 조건
   fx   = 분류 대신 직접 지정 [한국어, 영문태그] — 중복 기재하면 그만큼 확률이 올라감 */
const SLOTS = [
 {id:'count', n:'인원',    p:1,   fx:[['소녀 1명','1girl'],['소녀 1명','1girl'],['소녀 1명','1girl'],
                                     ['소녀 1명','1girl'],['소년 1명','1boy'],['소녀 2명','2girls']]},
 {id:'solo',  n:'구성',    p:1,   req:h=>h.has('1girl')||h.has('1boy'),
                                  fx:[['혼자','solo'],['혼자','solo'],['혼자','solo'],['상반신','upper_body']]},
 {id:'race',  n:'종족',    p:.10, c:['종족 · 동물','종족 · 수인','종족 · 판타지']},
 {id:'job',   n:'직업',    p:.18, c:['직업 · 일반','직업 · 전문','직업 · 판타지','직업 · 메이드','직업 · 예술']},
 {id:'hairc', n:'머리색',  p:1,   c:['머리카락 · 색깔']},
 {id:'hairs', n:'머리모양',p:.9,  c:['머리카락 · 스타일']},
 {id:'eyec',  n:'눈색',    p:1,   c:['눈 · 색깔']},
 {id:'eyes',  n:'눈매',    p:.25, c:['눈 · 모양','눈 · 특징']},
 {id:'face',  n:'표정',    p:.8,  c:['얼굴 · 표정']},
 {id:'body',  n:'체형',    p:.18, c:['몸 · 모양']},
 {id:'fit',   n:'전신의상',p:.55, c:['의상 · 복장','의상 · 드레스','의상 · 제복','의상 · 정장',
                                     '의상 · 슈트','의상 · 운동복']},
 {id:'cos',   n:'코스튬',  p:.12, need:['fit'], c:['의상 · 코스튬']},
 {id:'top',   n:'상의',    p:1,   need:['fit','cos'], c:['상의 · 셔츠','상의 · 스웨터','상의 · 재킷',
                                     '상의 · 겉옷','상의 · 코트','상의 · 후드']},
 {id:'btm',   n:'하의',    p:1,   need:['fit','cos'], c:['하의 · 치마','하의 · 바지','하의 · 반바지']},
 {id:'shoe',  n:'신발',    p:.28, c:['신발','신발 · 부츠','신발 · 샌들']},
 {id:'sock',  n:'양말',    p:.22, c:['속옷 · 양말']},
 {id:'head',  n:'머리장식',p:.32, c:['머리 장식 · 모자','머리 장식 · 머리띠','머리 장식 · 장신구']},
 {id:'acc',   n:'장신구',  p:.28, c:['얼굴 장식 · 안경','목 장식 · 넥타이','목 장식 · 목걸이',
                                     '손 장식 · 장갑','귀 장식 · 귀걸이']},
 {id:'pose',  n:'자세',    p:1,   c:['몸 · 앉다','몸 · 눕다','몸 · 기대다','몸 · 동작','다리 · 자세']},
 {id:'hand',  n:'손동작',  p:.38, c:['손 · 올리다','손 · 동작','손가락 · 동작']},
 {id:'place', n:'장소',    p:1,   c:['장소 · 자연','장소 · 시설','장소 · 가정','장소 · 가게','장소 · 건축물',
                                     '장소 · 이동','장소 · 유흥','장소 · 현장','장소 · 운동']},
 {id:'prop',  n:'소품',    p:.2,  c:['테마 · 도구']},
 {id:'bg',    n:'배경연출',p:.18, c:['배경 · 컬러','배경 · 무늬']},
 {id:'view',  n:'시점',    p:.68, c:['초점 · 시점','초점 · 강조']},
 {id:'style', n:'화풍',    p:.18, c:['작화 · 스타일','작화 · 화풍']},
];

/* 테마 — c 로 후보 분류를 갈아끼우고, p 로 확률을 덮어씁니다 */
const THEMES = {
 '전부'  : {},
 '실내'  : {c:{place:['장소 · 가정','장소 · 가게','장소 · 시설','장소 · 유흥','장소 · 건축물']}},
 '야외'  : {c:{place:['장소 · 자연','장소 · 이동','장소 · 운동','장소 · 현장']}},
 '판타지': {c:{place:['장소 · 자연','장소 · 건축물']}, p:{race:.55, job:.4, cos:.25, style:.3}},
 '인물'  : {p:{place:0, prop:0, bg:.55, view:.9, face:1, eyes:.5}},
};
const AMOUNTS = {'간결':.4, '보통':1, '풍성':1.9};

/* 표기 정리. 태그를 지우지는 않고 형태만 다듬습니다.
   CORP  : 콤마 파싱으로 끊어진 법인격을 앞 태그에 다시 붙임
   BADCH : 그대로는 쓸 수 없는 자리표시 문자 (괄호는 정상 태그이므로 건드리지 않음) */
const CORP  = new Set(['ltd.','inc.','llc','co.','ltd','inc','k.k.']);
const BADCH = /[*{}=]/;

/* ══════════════════════════════════════════════════════════════
   여기서부터는 고칠 일이 없습니다
   ══════════════════════════════════════════════════════════════ */

let CATS=[], GROUPS={}, NAMES=[], CI={};
let picked=[], sets=[], built=[], active='', query='', storage=true, ready=false;
let locks=new Set(), theme='전부', amount='보통', seed=0;
const K_CUR='tagset.current.v1', K_SET='tagset.sets.v1', K_OPT='tagset.opt.v1';

function read(k,d){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):d; }catch(e){ storage=false; return d; } }
function write(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ storage=false; } }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wrap(t,w){ return w===-1?'['+t+']' : w===1?'{'+t+'}' : w===2?'{{'+t+'}}' : t; }
const buildStr=()=>picked.map(p=>wrap(p.tag,p.w)).join(', ');

/* ── tags.json 적재 ── */
function normalize(raw){
  const cats=[], ci={}, groups={};
  let entries=0, skipped=0;
  for(const g of Object.keys(raw)){
    const rows=[];
    for(const it of raw[g]||[]){
      if(!it || !Array.isArray(it.tags)) continue;
      const cat=(it.category||'').trim(), sub=(it.subCategory||'').trim();
      const label=(sub && sub!==cat) ? cat+' · '+sub : (cat||'기타');
      if(!(label in ci)){ ci[label]=cats.length; cats.push(label); }

      const merged=[];
      for(const t0 of it.tags){
        const t=String(t0).trim(); if(!t) continue;
        if(CORP.has(t.toLowerCase()) && merged.length) merged[merged.length-1]+='_'+t;
        else merged.push(t);
      }
      const ok=[];
      for(const t of merged){
        const n=t.toLowerCase().replace(/\s+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
        if(n && !BADCH.test(n) && ok.indexOf(n)<0) ok.push(n);
      }
      if(!ok.length){ skipped++; continue; }
      rows.push([ci[label], String(it.name||ok[0]), ok.join('|')]);
      entries++;
    }
    if(rows.length){ rows.sort((a,b)=>a[0]-b[0] || a[1].localeCompare(b[1],'ko')); groups[g]=rows; }
  }
  return {cats, ci, groups, entries, skipped};
}

function fail(html){
  ready=false;
  $('#main').innerHTML='<p class="msg">'+html+'</p>';
  $('#nav').innerHTML='';
}

function boot(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw))
    return fail('<span class="big">형식이 맞지 않습니다</span>'
      +'<code>'+esc(SRC)+'</code> 은 그룹 이름을 키로 갖는 객체여야 합니다.'
      +'<pre>{\n  "그룹이름": [\n    { "category": "품질",\n      "subCategory": "완성도",\n      "name": "명작",\n      "tags": ["masterpiece"] }\n  ]\n}</pre>');

  const r=normalize(raw);
  if(!r.entries) return fail('<span class="big">읽을 항목이 없습니다</span><code>'+esc(SRC)+'</code> 안에 유효한 항목이 하나도 없습니다.');

  CATS=r.cats; CI=r.ci; GROUPS=r.groups; NAMES=Object.keys(GROUPS); active=NAMES[0];
  $('#srcinfo').textContent=r.entries.toLocaleString()+'항목';
  buildSlots();
  $('#nav').innerHTML=NAMES.map(n=>'<button role="tab" data-g="'+esc(n)+'" aria-selected="'+(n===active)+'">'+esc(n)+'</button>').join('');
  ready=true;
  render(); renderSlots();
  if(r.skipped) console.info('자리표시 문자 등으로 건너뛴 항목: '+r.skipped);
}

fetch(SRC,{cache:'no-store'})
  .then(res=>{ if(!res.ok) throw new Error(res.status); return res.json(); })
  .then(boot)
  .catch(err=>{
    const local = location.protocol==='file:';
    fail('<span class="big">'+esc(SRC)+' 을 읽지 못했습니다</span>'
      +(local
        ? '브라우저가 <code>file://</code> 에서 다른 파일 읽기를 막고 있습니다.<br>'
          +'GitHub Pages 같은 곳에 올리거나, 폴더에서 간단한 서버를 띄우세요.'
          +'<pre>python3 -m http.server 8000\n→ http://localhost:8000</pre>'
        : '<code>index.html</code> 과 같은 폴더에 <code>'+esc(SRC)+'</code> 이 있는지 확인하세요.<br>'
          +'<small>'+esc(String(err.message||err))+'</small>'));
  });

/* ── 슬롯 구축 ── */
let SLOT={};
function poolOf(s,cats){
  if(s.fx) return s.fx.map(f=>[-1,f[0],f[1]]);
  const idx=new Set((cats||s.c||[]).map(c=>CI[c]).filter(i=>i!==undefined));
  const out=[];
  for(const g of NAMES) for(const r of GROUPS[g]) if(idx.has(r[0])) out.push(r);
  return out;
}
function buildSlots(){
  for(const s of SLOTS){ s.all=poolOf(s); s.tags=new Set(s.all.map(r=>r[2].split('|')[0])); }
  SLOT={}; for(const s of SLOTS) SLOT[s.id]=s;
}
function pool(s){ const t=THEMES[theme]; return (t&&t.c&&t.c[s.id]) ? poolOf(s,t.c[s.id]) : s.all; }
function prob(s){
  const t=THEMES[theme]||{}, base=(t.p && s.id in t.p) ? t.p[s.id] : s.p;
  return base>=1 ? base : Math.min(1, base*AMOUNTS[amount]);
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const hex=n=>(n>>>0).toString(16).padStart(8,'0');
function pickFrom(s,rnd){
  const p=pool(s); if(!p.length) return null;
  const r=p[Math.floor(rnd()*p.length)];
  return {ko:r[1], tag:r[2].split('|')[0], w:0, s:s.id};
}

function doRoll(mode){
  if(!ready){ toast('데이터가 아직 없습니다'); return; }
  if(mode==='all'){ seed=(Math.random()*4294967296)>>>0; $('#seedv').value=hex(seed); }
  const rnd=mulberry(seed||1);
  const manual=picked.filter(p=>!p.s);
  const keep=picked.filter(p=>p.s && (mode==='fill' || locks.has(p.s)));
  const done=new Set(keep.map(p=>p.s));
  const have=new Set(manual.concat(keep).map(p=>p.tag));
  const out=[];
  for(const s of SLOTS){
    const kept=keep.find(p=>p.s===s.id);
    if(kept){ out.push(kept); continue; }
    if(!s.all || !s.all.length) continue;
    if(s.need && s.need.some(x=>done.has(x))) continue;
    if(s.req && !s.req(have)) continue;
    if(rnd()>prob(s)) continue;
    const v=pickFrom(s,rnd);
    if(!v || have.has(v.tag)) continue;
    out.push(v); have.add(v.tag); done.add(s.id);
  }
  picked=out.concat(manual);
  persist(); renderSlots();
  toast(out.length+'개 슬롯 · 시드 '+hex(seed));
}
function rerollOne(id){
  const s=SLOT[id]; if(!s) return;
  const clash=s.need && s.need.find(x=>picked.some(p=>p.s===x));
  if(clash){ toast('『'+SLOT[clash].n+'』 과 같이 쓸 수 없습니다'); return; }
  const have=new Set(picked.filter(p=>p.s!==id).map(p=>p.tag));
  if(s.req && !s.req(have)){ toast('앞 슬롯 조건이 맞지 않습니다'); return; }
  let v=null;
  for(let i=0;i<12;i++){ v=pickFrom(s,Math.random); if(v && !have.has(v.tag)) break; v=null; }
  if(!v){ toast('뽑을 후보가 없습니다'); return; }
  const at=picked.findIndex(p=>p.s===id);
  if(at>=0) picked[at]=v; else picked.unshift(v);
  persist(); renderSlots();
}

/* ── 렌더 ── */
function rows(){
  if(!ready) return [];
  if(query){
    const q=query.toLowerCase(), out=[];
    for(const g of NAMES) for(const r of GROUPS[g])
      if(r[1].toLowerCase().indexOf(q)>=0 || r[2].toLowerCase().indexOf(q)>=0) out.push(r);
    return out.slice(0,400);
  }
  return GROUPS[active]||[];
}
function render(){
  if(!ready) return;
  const list=rows(), m=$('#main');
  if(!list.length){ m.innerHTML='<p class="msg"><b>'+esc(query)+'</b> 에 맞는 태그가 없습니다.<br>다른 말로 찾아보세요.</p>'; return; }
  const on=new Set(picked.map(p=>p.tag));
  let html='', cur=-1;
  for(const r of list){
    if(r[0]!==cur){ cur=r[0]; html+='<div class="cat">'+esc(CATS[r[0]])+'</div><div class="grid">'; }
    const t=r[2].split('|')[0];
    html+='<button class="chip" data-t="'+esc(t)+'" data-ko="'+esc(r[1])+'" aria-pressed="'+on.has(t)+'">'
        +esc(r[1])+'<span class="en">'+esc(t)+'</span></button>';
  }
  m.innerHTML=html;
}
function renderBar(){
  $('#n').textContent=picked.length; $('#hcount').textContent=picked.length;
  $('#out').textContent=buildStr();
  $('#picked').innerHTML=picked.map((p,i)=>{
    const cls=p.w>0?'up':(p.w<0?'dn':'');
    return '<span class="pick'+(p.s?' auto':'')+'"><button class="t '+cls+'" data-i="'+i+'" title="탭하면 강조 조절">'
      +esc(wrap(p.tag,p.w))+'</button><button class="x" data-x="'+i+'" aria-label="빼기">&times;</button></span>';
  }).join('');
  const all=built.map(s=>({name:s.name,tags:s.tags,ro:1})).concat(sets);
  $('#sets').innerHTML = all.length ? all.map((s,i)=>
    '<span class="set'+(s.ro?' built':'')+'" title="'+(s.ro?'저장소의 presets.json':'이 브라우저에만 있음')+'">'
    +'<button class="nm" data-load="'+i+'">'+esc(s.name)+'<small>'+s.tags.length+'</small></button>'
    +'<button class="add" data-add="'+i+'" title="현재 조판에 이어붙이기">＋</button>'
    +(s.ro?'':'<button class="x" data-del="'+i+'" aria-label="삭제">&times;</button>')+'</span>').join('')
    : '<span class="none">보관된 조판이 없습니다.</span>';
  document.documentElement.style.setProperty('--bar', $('#bar').offsetHeight+'px');
}
function renderSlots(){
  const by={}; for(const p of picked) if(p.s) by[p.s]=p;
  $('#slots').innerHTML=SLOTS.map(s=>{
    const v=by[s.id], empty=!s.all||!s.all.length;
    return '<div class="sl'+(v?'':' off')+(locks.has(s.id)?' lock':'')+'">'
      +'<button class="lk" data-lock="'+s.id+'" aria-label="잠금">'+(locks.has(s.id)?'●':'○')+'</button>'
      +'<span class="nm">'+esc(s.n)+'</span>'
      +'<span class="vl">'+(v?esc(v.ko)+'<small>'+esc(v.tag)+'</small>':(empty?'분류 없음':'—'))+'</span>'
      +(v?'<button class="rr" data-clear="'+s.id+'" aria-label="비우기">&times;</button>':'')
      +'<button class="rr" data-re="'+s.id+'" aria-label="다시 뽑기">↻</button></div>';
  }).join('');
  renderBar();
}
function persist(){ write(K_CUR,picked); render(); renderBar(); }
function persistSets(){ write(K_SET,sets); renderBar(); }
function saveOpt(){ write(K_OPT,{theme:theme,amount:amount,locks:Array.from(locks)}); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }

/* ── 이벤트 ── */
$('#nav').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  active=b.dataset.g; query=''; $('#q').value=''; $('#sw').classList.remove('has');
  Array.from($('#nav').children).forEach(x=>x.setAttribute('aria-selected', String(x.dataset.g===active)));
  render(); scrollTo({top:0,behavior:'smooth'}); };
$('#main').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return;
  const i=picked.findIndex(p=>p.tag===c.dataset.t);
  if(i>=0) picked.splice(i,1); else picked.push({ko:c.dataset.ko,tag:c.dataset.t,w:0});
  persist(); renderSlots(); };
let deb;
$('#q').oninput=e=>{ query=e.target.value.trim(); $('#sw').classList.toggle('has',!!query);
  clearTimeout(deb); deb=setTimeout(render,120); };
$('#clr').onclick=()=>{ query=''; $('#q').value=''; $('#sw').classList.remove('has'); render(); $('#q').focus(); };
$('#picked').onclick=e=>{
  const x=e.target.closest('[data-x]'), t=e.target.closest('[data-i]');
  if(x) picked.splice(+x.dataset.x,1);
  else if(t){ const p=picked[+t.dataset.i]; p.w = p.w>=2 ? -1 : p.w+1; }
  else return;
  persist(); renderSlots(); };
$('#handle').onclick=()=>{ const b=$('#bar'); b.classList.toggle('open');
  $('#handle').setAttribute('aria-expanded', String(b.classList.contains('open'))); renderBar(); };
$('#handle').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('#handle').click(); } };
document.querySelector('.tabs').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  Array.from(e.currentTarget.children).forEach(x=>x.setAttribute('aria-selected', String(x===b)));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id===b.dataset.p));
  renderBar(); };

$('#themes').insertAdjacentHTML('beforeend', Object.keys(THEMES).map(k=>
  '<button data-th="'+esc(k)+'" aria-pressed="'+(k===theme)+'">'+esc(k)+'</button>').join(''));
$('#amounts').insertAdjacentHTML('beforeend', Object.keys(AMOUNTS).map(k=>
  '<button data-am="'+esc(k)+'" aria-pressed="'+(k===amount)+'">'+esc(k)+'</button>').join(''));
$('#themes').onclick=e=>{ const b=e.target.closest('[data-th]'); if(!b) return;
  theme=b.dataset.th; saveOpt();
  $('#themes').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.th===theme))); };
$('#amounts').onclick=e=>{ const b=e.target.closest('[data-am]'); if(!b) return;
  amount=b.dataset.am; saveOpt();
  $('#amounts').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.am===amount))); };
$('#rollall').onclick=()=>doRoll('all');
$('#rollfill').onclick=()=>doRoll('fill');
$('#reroll').onclick=()=>{
  const v=parseInt(String($('#seedv').value).trim(),16);
  if(!isFinite(v)){ toast('시드는 16진수로 입력하세요'); return; }
  seed=v>>>0; doRoll('seed'); };
$('#slots').onclick=e=>{
  const L=e.target.closest('[data-lock]'), R=e.target.closest('[data-re]'), C=e.target.closest('[data-clear]');
  if(L){ const id=L.dataset.lock; locks.has(id)?locks.delete(id):locks.add(id); saveOpt(); renderSlots(); }
  else if(C){ picked=picked.filter(p=>p.s!==C.dataset.clear); persist(); renderSlots(); }
  else if(R) rerollOne(R.dataset.re); };

$('#sets').onclick=e=>{
  const all=built.map(s=>({name:s.name,tags:s.tags,ro:1})).concat(sets);
  const L=e.target.closest('[data-load]'), A=e.target.closest('[data-add]'), D=e.target.closest('[data-del]');
  if(L){ const s=all[+L.dataset.load]; picked=s.tags.map(p=>Object.assign({},p)); persist(); renderSlots(); toast('『'+s.name+'』 불러옴'); }
  else if(A){ const s=all[+A.dataset.add], have=new Set(picked.map(p=>p.tag));
    for(const p of s.tags) if(!have.has(p.tag)){ picked.push(Object.assign({},p)); have.add(p.tag); }
    persist(); renderSlots(); toast('『'+s.name+'』 이어붙임'); }
  else if(D){ const s=all[+D.dataset.del];
    if(!confirm('『'+s.name+'』 을 삭제할까요?')) return;
    sets.splice(+D.dataset.del - built.length,1); persistSets(); toast('삭제됨'); } };
$('#save').onclick=()=>{
  if(!picked.length){ toast('조판이 비어 있습니다'); return; }
  const name=(prompt('보관할 이름','조판 '+(sets.length+1))||'').trim(); if(!name) return;
  const rec={name:name, tags:picked.map(p=>({ko:p.ko,tag:p.tag,w:p.w,s:p.s})), at:Date.now()};
  const i=sets.findIndex(s=>s.name===name);
  if(i>=0){ if(!confirm('『'+name+'』 을 덮어쓸까요?')) return; sets[i]=rec; } else sets.push(rec);
  persistSets(); toast('『'+name+'』 보관됨'); };
$('#exp').onclick=()=>{
  const all=built.concat(sets).map(s=>({name:s.name, tags:s.tags.map(p=>({ko:p.ko,tag:p.tag,w:p.w}))}));
  if(!all.length){ toast('보관된 조판이 없습니다'); return; }
  copy(JSON.stringify(all,null,1), all.length+'개 — 저장소의 presets.json 을 이 내용으로 바꾸고 커밋하세요'); };
$('#imp').onclick=()=>{
  const raw=prompt('내보낸 JSON을 붙여넣으세요'); if(!raw) return;
  try{
    const inc=JSON.parse(raw); if(!Array.isArray(inc)) throw 0;
    let n=0;
    for(const s of inc){
      if(!s || typeof s.name!=='string' || !Array.isArray(s.tags)) continue;
      const i=sets.findIndex(x=>x.name===s.name);
      if(i>=0) sets[i]=s; else sets.push(s); n++;
    }
    if(!n) throw 0;
    persistSets(); toast(n+'개 불러옴');
  }catch(e){ toast('형식이 맞지 않습니다'); } };

$('#presets').insertAdjacentHTML('beforeend','<span class="lbl">품질</span>'
  + Object.keys(QUALITY).map(k=>'<button data-q="'+esc(k)+'">'+esc(k)+'</button>').join('')
  + '<span class="lbl">네거티브</span>'
  + Object.keys(NEG).map(k=>'<button data-n="'+esc(k)+'">'+esc(k)+'</button>').join(''));
$('#presets').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.q){
    const have=new Set(picked.map(p=>p.tag));
    picked=QUALITY[b.dataset.q].split(', ').filter(t=>!have.has(t)).map(t=>({ko:'품질',tag:t,w:0})).concat(picked);
    persist(); toast(b.dataset.q+' 품질 태그 추가');
  } else copy(NEG[b.dataset.n], '네거티브 복사됨'); };

function copy(text,msg){
  if(!text){ toast('복사할 내용이 없습니다'); return; }
  const ok=()=>toast(msg);
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, ()=>fallback(text,ok));
  else fallback(text,ok);
}
function fallback(text,ok){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('복사 실패 — 길게 눌러 선택하세요'); }
  ta.remove();
}
$('#copy').onclick=()=>copy(buildStr(), picked.length+'개 태그 복사됨');
$('#reset').onclick=()=>{ if(!picked.length) return; picked=[]; persist(); renderSlots(); toast('비웠습니다'); };
addEventListener('resize',renderBar);

picked=read(K_CUR,[]); sets=read(K_SET,[]);
const opt=read(K_OPT,null);
if(opt){

}
$('#themes').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.th===theme)));
$('#amounts').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.am===amount)));
$('#warn').textContent = storage
  ? '보관함은 이 브라우저에만 남습니다. 오래 쓸 조판은 presets.json 복사 → 저장소의 presets.json 에 붙여넣고 커밋하세요.'
  : '이 환경에서는 저장이 되지 않습니다. 서버에 올리거나 파일을 내려받아 열면 보관 기능이 동작합니다.';

fetch('presets.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!Array.isArray(j)) return;
  built=j.filter(s=>s && typeof s.name==='string' && Array.isArray(s.tags));
  const names=new Set(built.map(s=>s.name)), before=sets.length;
  sets=sets.filter(s=>names.has(s.name)===false);
  if(sets.length!==before) write(K_SET,sets);
  renderBar();
}).catch(function(){});

renderSlots();
</script>
</body>
</html>
